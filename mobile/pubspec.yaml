name: luxxito_sports_mobile
description: "Aplicación móvil cliente de Luxxito Sports (SI806 - Taller 3 UNI)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  qr_flutter: ^4.1.0
  image_picker: ^1.2.4
  mobile_scanner: ^7.5.0
  package_info_plus: ^10.2.2
  ota_update: ^7.1.0
  flutter_secure_storage: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Ícono de la app: el logo conserva sus bordes redondeados en cualquier celular.
# La capa adaptativa lleva el logo dentro de la zona que Android nunca recorta,
# sobre fondo transparente. Regenerar con: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icono_legacy.png"
  adaptive_icon_background: "#00000000"
  adaptive_icon_foreground: "assets/icon/icono_adaptativo_frente.png"
  adaptive_icon_foreground_inset: 0
  min_sdk_android: 24
