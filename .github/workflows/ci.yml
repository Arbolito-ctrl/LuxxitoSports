name: Luxxito Sports CI (Backend + Mobile + Contracts)

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  backend-tests:
    name: API REST Propia (Build & Tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npm run build
      - run: npm test
      - name: Validar configuración del APK
        run: node --test ../.github/scripts/validate-apk-config.test.cjs ../.github/scripts/trigger-render.test.cjs

  mobile-checks:
    name: Flutter Mobile Client (Analyze & Test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  deploy-render:
    name: Publicar backend en Render tras pruebas
    needs: [backend-tests, mobile-checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    concurrency:
      group: render-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Desplegar el commit aprobado por CI
        uses: actions/github-script@v7
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        with:
          script: |
            await require('./.github/scripts/trigger-render.cjs')({
              github, context, core, hook: process.env.RENDER_DEPLOY_HOOK_URL,
            });

