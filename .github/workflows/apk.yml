name: Build & Publish Android APK (Por Ambiente)

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'mobile/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Ambiente de destino para el APK'
        required: true
        default: 'production'
        type: choice
        options:
          - development
          - production

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Compilar y Publicar APK Descargable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17 para Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Determinar ambiente (develop vs main)
        id: env_info
        run: |
          if [ "${{ github.ref_name }}" = "main" ] || [ "${{ inputs.environment }}" = "production" ]; then
            echo "ENV_NAME=prod" >> $GITHUB_OUTPUT
            echo "TAG_NAME=latest-apk" >> $GITHUB_OUTPUT
            echo "RELEASE_TITLE=Luxxito Sports APK (Producción - ${{ github.sha }})" >> $GITHUB_OUTPUT
          else
            echo "ENV_NAME=dev" >> $GITHUB_OUTPUT
            echo "TAG_NAME=dev-apk" >> $GITHUB_OUTPUT
            echo "RELEASE_TITLE=Luxxito Sports APK (Desarrollo - ${{ github.sha }})" >> $GITHUB_OUTPUT
          fi

      - name: Instalar dependencias Flutter y verificar tests
        working-directory: ./mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Validar configuración pública del APK
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: node .github/scripts/validate-apk-config.cjs

      # Clave de firma fija: sin ella cada APK sale firmado con una clave temporal
      # distinta y Android no permite instalarlo encima del anterior.
      - name: Preparar clave de firma del APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            if [ "${{ steps.env_info.outputs.ENV_NAME }}" = "prod" ]; then
              echo "::error::Falta el secret ANDROID_KEYSTORE_BASE64: el APK de producción debe firmarse con la clave fija."
              exit 1
            fi
            echo "::warning::Sin ANDROID_KEYSTORE_BASE64: el APK de desarrollo se firma con una clave temporal."
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/luxxito-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/luxxito-release.jks" >> "$GITHUB_ENV"

      - name: Compilar APK de Android con configuración de entorno
        working-directory: ./mobile
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          flutter build apk --release \
            --build-name=1.0.${{ github.run_number }} \
            --build-number=${{ github.run_number }} \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=ALLOW_SUPABASE_DIRECT=false \
            --dart-define=APK_CANAL=${{ steps.env_info.outputs.TAG_NAME }}
          # Versión publicada que la app consulta para ofrecer la actualización
          printf '{"version":"1.0.%s","build_number":%s,"commit":"%s","canal":"%s"}\n' \
            "${{ github.run_number }}" "${{ github.run_number }}" "${{ github.sha }}" \
            "${{ steps.env_info.outputs.TAG_NAME }}" > build/app/outputs/flutter-apk/version.json
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/luxxito-sports.apk
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/luxxito-sports-${{ steps.env_info.outputs.ENV_NAME }}.apk

      - name: Subir APK como Artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: luxxito-sports-apk-${{ steps.env_info.outputs.ENV_NAME }}
          path: |
            mobile/build/app/outputs/flutter-apk/luxxito-sports.apk
            mobile/build/app/outputs/flutter-apk/luxxito-sports-${{ steps.env_info.outputs.ENV_NAME }}.apk
          retention-days: 30

      - name: Publicar APK para Descarga Directa en GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: ${{ steps.env_info.outputs.TAG_NAME }}
          name: ${{ steps.env_info.outputs.RELEASE_TITLE }}
          body: |
            ### Actualización Automática de APK — Luxxito Sports
            - **Ambiente:** `${{ steps.env_info.outputs.ENV_NAME }}`
            - **Versión:** `1.0.${{ github.run_number }}` (Build #`${{ github.run_number }}`)
            - **Commit:** `${{ github.sha }}`
            - **Descarga directa:** Haz clic en `luxxito-sports.apk` abajo para instalar o actualizar la aplicación en tu dispositivo Android.
          files: |
            mobile/build/app/outputs/flutter-apk/luxxito-sports.apk
            mobile/build/app/outputs/flutter-apk/version.json
            mobile/build/app/outputs/flutter-apk/luxxito-sports-${{ steps.env_info.outputs.ENV_NAME }}.apk
          prerelease: ${{ steps.env_info.outputs.ENV_NAME == 'dev' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Asociar tag de APK al commit compilado
        uses: actions/github-script@v7
        env:
          APK_TAG: ${{ steps.env_info.outputs.TAG_NAME }}
        with:
          script: |
            const tag = process.env.APK_TAG;
            if (!['latest-apk', 'dev-apk'].includes(tag)) throw new Error('Tag de APK inesperado');
            // Solo mueve el tag móvil del artefacto; nunca modifica main/develop.
            await github.rest.git.updateRef({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: `tags/${tag}`,
              sha: context.sha,
              force: true,
            });
