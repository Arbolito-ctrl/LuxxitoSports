openapi: 3.0.3
info:
  title: Luxxito Sports REST API
  version: 1.4.0
  description: >
    Contrato OpenAPI de la API REST propia de Luxxito Sports (SI806 - Taller 3 UNI).
    El servidor es la autoridad sobre disponibilidad, precios, stock de extras por intervalo,
    bloqueo de 20 minutos, aprobación idempotente de pagos manuales (protegida con JWT y rol ADMIN)
    y política de cancelación de 24 horas.
servers:
  - url: https://luxxito-sports-api.onrender.com/api
    description: API pública del Taller 3 en Render (plan gratuito)
  - url: http://localhost:3000/api
    description: Servidor de desarrollo local
  - url: http://10.0.2.2:3000/api
    description: Acceso desde Emulador Android
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT firmado con JWT_SECRET emitido por POST /api/auth/login o POST /api/auth/registro
paths:
  /auth/login:
    post:
      summary: Autenticación de usuario (Jugador o Administrador) y emisión de JWT
      responses:
        '200':
          description: Inicio de sesión exitoso con token JWT y perfil del usuario
        '401':
          description: Credenciales inválidas
  /auth/registro:
    post:
      summary: Registro de nuevo usuario (rol JUGADOR) y emisión de JWT
      responses:
        '201':
          description: Cuenta creada exitosamente
        '400':
          description: Datos de entrada inválidos
        '409':
          description: Correo o DNI duplicado
  /auth/me:
    get:
      summary: Obtener perfil del usuario autenticado a partir del token JWT (LX-201)
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil del usuario autenticado
        '401':
          description: Token JWT ausente o inválido
  /health:
    get:
      summary: Diagnóstico de la API y modo de base de datos (Supabase / Local)
      responses:
        '200':
          description: Servicio operativo
  /complejos:
    get:
      summary: Listar complejos deportivos activos
      parameters:
        - in: query
          name: distrito
          schema:
            type: string
      responses:
        '200':
          description: Lista de complejos
  /canchas:
    get:
      summary: Listar y filtrar canchas deportivas
      parameters:
        - in: query
          name: complejo_id
          schema:
            type: integer
        - in: query
          name: distrito
          schema:
            type: string
        - in: query
          name: deporte
          schema:
            type: string
      responses:
        '200':
          description: Lista de canchas relacionadas con su complejo
    post:
      summary: Crear nueva cancha deportiva (CRUD Create)
      responses:
        '201':
          description: Cancha creada
        '400':
          description: Datos de entrada inválidos (ej. tarifa nocturna menor a diurna)
  /canchas/{id}:
    get:
      summary: Obtener detalle de una cancha
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cancha encontrada
        '404':
          description: Cancha no encontrada
    put:
      summary: Actualizar cancha deportiva (CRUD Update)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Cancha actualizada
  /canchas/{id}/disponibilidad:
    get:
      summary: Consultar disponibilidad horaria, tarifas diurna/nocturna y stock de extras
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
        - in: query
          name: fecha
          required: true
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Grilla de turnos y stock de extras disponibles
  /reservas/verificar-qr:
    post:
      summary: Verificar e invalidar uso único de Ticket QR en puerta (LX-202, requiere JWT con rol ADMIN)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigo_qr]
              properties:
                codigo_qr:
                  type: string
                  example: LUXXITO-QR-1-8F3A19C0D2
      responses:
        '200':
          description: Ticket QR verificado e ingreso registrado (INGRESO_REGISTRADO)
        '400':
          description: Formato de código QR inválido
        '401':
          description: Token JWT ausente o inválido
        '403':
          description: Acceso denegado (se requiere rol ADMIN)
        '404':
          description: Código QR inexistente
        '409':
          description: Ticket QR ya utilizado previamente o revocado por cancelación
  /reservas/cotizar:
    post:
      summary: Cotizar reserva y extras en el servidor
      responses:
        '200':
          description: Cotización exacta con desglose de horas y seña del 50%
        '409':
          description: Cancha inactiva o stock insuficiente de extras en el intervalo
  /reservas:
    get:
      summary: Listar reservas con sus extras y pagos (CRUD Read)
      responses:
        '200':
          description: Lista de reservas
    post:
      summary: Crear reserva con bloqueo temporal de 20 minutos y exclusión mutua
      responses:
        '201':
          description: Reserva creada con estado PENDIENTE_PAGO
        '400':
          description: Error de validación de datos del cliente o formato
        '409':
          description: Conflicto por solapamiento horario o falta de stock de extras
        '422':
          description: Regla de negocio violada (horario pasado o fuera de atención)
  /reservas/{id}:
    get:
      summary: Obtener detalle de reserva
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detalle de la reserva
    put:
      summary: Actualizar datos de contacto o notas de una reserva (CRUD Update)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reserva actualizada
    delete:
      summary: Eliminar reserva no confirmada (CRUD Delete)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reserva eliminada
        '409':
          description: No se permite eliminar físicamente una reserva confirmada
  /reservas/{id}/pagos:
    post:
      summary: Registrar comprobante de pago manual (Yape/Plin/Transferencia)
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [metodo, modalidad, numero_operacion]
              properties:
                metodo:
                  type: string
                  enum: [YAPE, PLIN, TRANSFERENCIA]
                modalidad:
                  type: string
                  enum: [TOTAL, SENA_50]
                monto:
                  type: number
                  description: Opcional; por defecto el servidor usa el monto de la modalidad
                numero_operacion:
                  type: string
                  minLength: 4
                comprobante_url:
                  type: string
                  nullable: true
                  description: Referencia devuelta por POST /pagos/comprobante (debe ser de la misma reserva)
                  example: supabase://comprobantes/reserva-1/voucher-1730650000000.jpg
      responses:
        '201':
          description: Comprobante registrado (EN_REVISION o CONFIRMADA con QR)
        '400':
          description: Datos inválidos o comprobante_url de otra reserva
        '422':
          description: Importe no coincide con la modalidad elegida (SENA_50 o TOTAL)
  /pagos/comprobante:
    post:
      summary: Subir la foto del voucher al bucket privado comprobantes (Supabase Storage)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reserva_id, contenido_base64]
              properties:
                reserva_id:
                  type: integer
                mime_type:
                  type: string
                  enum: [image/jpeg, image/png, image/webp]
                  default: image/jpeg
                contenido_base64:
                  type: string
                  description: Imagen en base64 (máximo 5 MB; cuerpo JSON de hasta 8 MB)
      responses:
        '201':
          description: >
            Voucher guardado. Devuelve `comprobante_url` (supabase://comprobantes/...) para enviarlo en
            POST /reservas/{id}/pagos, y `almacenado` (false solo en pruebas o modo local).
        '400':
          description: reserva_id inválido, formato no permitido o contenido vacío
        '404':
          description: Reserva no encontrada
        '409':
          description: La reserva está CANCELADA o VENCIDA
        '413':
          description: El cuerpo supera el límite permitido (PAYLOAD_TOO_LARGE)
        '422':
          description: La imagen supera 5 MB
        '502':
          description: Error al guardar en Storage o Storage no configurado en el servidor (STORAGE_ERROR)
  /pagos:
    get:
      summary: Bandeja de revisión del operador (requiere JWT con rol ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: estado
          required: false
          description: Filtra por estado del pago (la bandeja usa PENDIENTE_REVISION)
          schema:
            type: string
            enum: [PENDIENTE_REVISION, APROBADO, RECHAZADO, REEMBOLSADO]
      responses:
        '200':
          description: >
            Lista de pagos con `count`, el resumen `reserva` de cada uno y `comprobante_url_firmada`
            (enlace temporal de 1 hora para ver el voucher del bucket privado, o null)
        '400':
          description: Estado de pago inválido
        '401':
          description: Token JWT ausente o inválido
        '403':
          description: Acceso denegado (se requiere rol ADMIN)
  /pagos/{id}/aprobar:
    patch:
      summary: Aprobar pago de manera idempotente y emitir Ticket QR (requiere JWT con rol ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Pago aprobado y reserva confirmada con QR (idempotent=true si ya estaba aprobado)
        '401':
          description: Token JWT ausente o inválido
        '403':
          description: Acceso denegado (se requiere rol ADMIN)
        '404':
          description: Pago no encontrado
        '409':
          description: Pago RECHAZADO/REEMBOLSADO o reserva CANCELADA/VENCIDA
  /pagos/{id}/rechazar:
    patch:
      summary: Rechazar comprobante con motivo obligatorio e idempotencia (requiere JWT con rol ADMIN)
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [observacion]
              properties:
                observacion:
                  type: string
                  minLength: 5
                  example: Número de operación no coincide con el voucher
      responses:
        '200':
          description: >
            Pago RECHAZADO con su observación. Si la reserva estaba EN_REVISION vuelve a
            PENDIENTE_PAGO con un nuevo bloqueo de 20 minutos para reenviar comprobante
            (idempotent=true si ya estaba rechazado).
        '400':
          description: Observación ausente o menor a 5 caracteres
        '401':
          description: Token JWT ausente o inválido
        '403':
          description: Acceso denegado (se requiere rol ADMIN)
        '404':
          description: Pago no encontrado
        '409':
          description: Pago APROBADO/REEMBOLSADO o reserva CANCELADA/VENCIDA
  /reservas/{id}/cancelar:
    post:
      summary: Cancelar reserva aplicando política de reembolso de 24 horas
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Reserva cancelada con cálculo de penalidad/reembolso y QR revocado
